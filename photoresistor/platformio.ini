[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
; monitor_speed = 115200 (Данная скорость выставляется для заливки прошивки, после успешной прошивки меняем скорость для корректного отображения в режиме Serial Monitor на 9600)
monitor_speed = 9600

; Обход внутренних багов PlatformIO: вызываем системный avrdude напрямую
upload_protocol = custom
upload_command = /usr/bin/avrdude -v -C /etc/avrdude.conf -p m328p -c arduino -P /dev/ttyUSB0 -b 57600 -D -U flash:w:$SOURCE:i